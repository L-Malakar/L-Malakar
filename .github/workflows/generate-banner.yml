name: Generate profile banner

on:
  schedule: # every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: sanity check template exists
        run: |
          if [ ! -f "images/banner-template.svg" ]; then
            echo "::error::images/banner-template.svg not found. Make sure it's committed in the images/ folder."
            exit 1
          fi

      - name: fetch profile data and build banner
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          python3 scripts/build_banner.py

      - name: push loading-banner.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: banner-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
