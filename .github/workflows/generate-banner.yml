name: Generate profile banner

on:
  schedule: # every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: sanity check template exists
        run: |
          if [ ! -f "images/banner-template.svg" ]; then
            echo "::error::images/banner-template.svg not found. Make sure it's committed in the images/ folder."
            exit 1
          fi

      - name: fetch profile data (name, avatar, contributions, top repos)
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          mkdir -p dist

          # 1. GraphQL query: display name, total contributions (last year),
          #    and repos ranked by commit contributions
          QUERY=$(python3 -c '
import json
q = """
query($login: String!) {
  user(login: $login) {
    name
    login
    avatarUrl
    contributionsCollection {
      contributionCalendar {
        totalContributions
      }
      commitContributionsByRepository(maxRepositories: 10) {
        repository { name }
        contributions { totalCount }
      }
    }
  }
}
"""
print(json.dumps({"query": q, "variables": {"login": "'"${GH_USER}"'"}}))
')

          RESPONSE=$(curl -s -H "Authorization: bearer ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$QUERY" \
            https://api.github.com/graphql)

          echo "$RESPONSE" > dist/graphql_response.json

          # 2. Parse the response with python (far more reliable than grep/sed for JSON)
          python3 << 'PYEOF'
import json

with open("dist/graphql_response.json") as f:
    data = json.load(f)

if "errors" in data:
    print("::error::GraphQL API returned errors:", data["errors"])
    raise SystemExit(1)

user = data["data"]["user"]
name = user["name"] or user["login"]
avatar_url = user["avatarUrl"]

cc = user["contributionsCollection"]
total = cc["contributionCalendar"]["totalContributions"]

repos = cc["commitContributionsByRepository"]
# already ranked by GitHub; take top 2 by contribution count just to be safe
repos_sorted = sorted(repos, key=lambda r: r["contributions"]["totalCount"], reverse=True)
top_repo_names = [r["repository"]["name"] for r in repos_sorted[:2]]

if len(top_repo_names) >= 2:
    top_line = f"{top_repo_names[0]}, {top_repo_names[1]} and more..."
elif len(top_repo_names) == 1:
    top_line = f"{top_repo_names[0]} and more..."
else:
    top_line = "no contributions yet"

with open("dist/vars.env", "w") as out:
    out.write(f"NAME={name}\n")
    out.write(f"AVATAR_URL={avatar_url}\n")
    out.write(f"TOTAL={total}\n")
    out.write(f"TOP_LINE={top_line}\n")

print("Resolved:", name, total, top_line)
PYEOF

          # 3. Load the resolved values into the shell environment
          source dist/vars.env

          # 4. Download avatar, base64 encode
          curl -sL "$AVATAR_URL" -o dist/avatar.png
          if [ ! -s dist/avatar.png ]; then
            echo "::error::Avatar download failed or file is empty."
            exit 1
          fi
          AVATAR_B64=$(base64 -w 0 dist/avatar.png)

          # 5. Inject everything into the SVG template
          #    (escape & for XML safety in the top-repo line and name)
          NAME_ESC=$(echo "$NAME" | sed 's/&/\&amp;/g')
          TOP_LINE_ESC=$(echo "$TOP_LINE" | sed 's/&/\&amp;/g')

          python3 << PYEOF2
import re

with open("images/banner-template.svg") as f:
    svg = f.read()

svg = svg.replace("__AVATAR_BASE64__", """${AVATAR_B64}""")
svg = svg.replace("__NAME__", """${NAME_ESC}""")
svg = svg.replace("__TOTAL_CONTRIBUTIONS__", """${TOTAL}""")
svg = svg.replace("__TOP_REPOS_LINE__", """${TOP_LINE_ESC}""")

with open("dist/loading-banner.svg", "w") as f:
    f.write(svg)
PYEOF2

          rm dist/avatar.png dist/graphql_response.json dist/vars.env

      - name: push loading-banner.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: banner-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
